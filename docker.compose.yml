services:
  currency:
    image: microservices-currency:latest
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ./certs:/certs:ro
    environment:
      - PORT=8080
      - PROD=false
      # ---
      - HIST_ADDR=history:50051
      - CONV_ADDR=conversion:50053
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate --spider --quiet https://localhost:8080/healthz || exit 1"]
      retries: 3
      timeout: 3s
      interval: 3s
      start_period: 3s

    restart: unless-stopped
    mem_reservation: 256m
    mem_limit: 512m
    cpus: '0.5'

    build:
      context: .
      dockerfile: Dockerfile
      args:
        CMD_NAME: ${CMD_NAME:-microservices-currency}
        GO_VERSION: ${GO_VERSION:-1.25.0}
    container_name: microservices-currency





