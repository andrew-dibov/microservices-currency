x-base: &base
  mem_reservation: 256m
  mem_limit: 512m
  cpus: '0.5'

  restart: unless-stopped

  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "5"

x-healthcheck: &healthcheck
  retries: 3
  timeout: 3s
  interval: 3s
  start_period: 30s
  start_interval: 3s

# ---

services:
  currency-postgres:
    <<: *base
    image: postgres:16-alpine
    container_name: ${CMD_NAME:-microservices-currency}-postgres

    volumes:
      - currency:/var/lib/postgresql/data

    networks:
      - data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d currency -h localhost"]
      <<: *healthcheck

    # ---

    env_file: [".env"]

  # ---

  currency-postgres-migrate:
    image: migrate/migrate
    container_name: ${CMD_NAME:-microservices-currency}-postgres-migrate

    volumes:
      - ./migrations:/migrations

    command: [
      "-path=/migrations",
      "-database=postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-2525}@${CMD_NAME:-microservices-currency}-postgres:5432/${POSTGRES_DB:-currency}?sslmode=disable",
      "up"
    ]

    depends_on:
      currency-postgres:
        condition: service_healthy

    networks:
      - data